  /pass/v1/organization/settings/password_policy:
    put:
      tags: [pass]
      summary: Put Pass Organization Settings Password Policy
      operationId: putPassOrganizationSettingsPasswordPolicy
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - RandomPasswordAllowed
                - MemorablePasswordAllowed
              properties:
                RandomPasswordAllowed:
                  type: boolean
                  description: Whether subusers are allowed to generate random passwords
                RandomPasswordMinLength:
                  type: string
                  description: Minimum password length. Default limit if null.
                RandomPasswordMaxLength:
                  type: string
                  description: Maximum password length. Default limit if null.
                RandomPasswordMustIncludeNumbers:
                  type: string
                  description: Whether the password must include numbers. If true, it must. If false, it must not. Cannot be changed if not null. Can be changed if null.
                RandomPasswordMustIncludeSymbols:
                  type: string
                  description: Whether the password must include symbols. If true, it must. If false, it must not. Cannot be changed if not null. Can be changed if null.
                RandomPasswordMustIncludeUppercase:
                  type: string
                  description: Whether the password must include uppercase characters. If true, it must. If false, it must not. Cannot be changed if not null. Can be changed if null.
                MemorablePasswordAllowed:
                  type: boolean
                  description: Whether subusers are allowed to generate memorable passwords
                MemorablePasswordMinWords:
                  type: string
                  description: Minimum amount of words for the memorable passwords. Default limit if null.
                MemorablePasswordMaxWords:
                  type: string
                  description: Maximum amount of words for the memorable passwords. Default limit if null.
                MemorablePasswordMustCapitalize:
                  type: string
                  description: Whether the password must capitalize words. If true, it must. If false, it must not. Cannot be changed if not null. Can be changed if null.
                MemorablePasswordMustIncludeNumbers:
                  type: string
                  description: Whether the password must include numbers. If true, it must. If false, it must not. Cannot be changed if not null. Can be changed if null.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      Code:
                        type: integer
                      Organization:
                        type: object

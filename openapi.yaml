              type: object
              required:
                - Name
                - NameSignatureEmail
                - SignatureAddress
                - OriginalHash
                - MIMEType
              properties:
                Name:
                  type: string
                  description: Name, reusing same session key as previously.
                Hash:
                  type: string
                  description: Name hash; ignored/nullable for root-links
                NameSignatureEmail:

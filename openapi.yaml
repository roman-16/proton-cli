openapi: 3.1.0
info:
  title: Proton API
  version: "1.0"
  description: |
    Auto-generated from ProtonMail/WebClients TypeScript source files.
    Source: https://github.com/ProtonMail/WebClients/tree/main/packages/shared/lib/api

servers:
  - url: https://mail.proton.me/api
    description: Proton production API

security:
  - protonAuth: []

components:
  securitySchemes:
    protonAuth:
      type: http
      scheme: bearer
      description: |
        Requires headers: Authorization (Bearer token), x-pm-uid (session UID), x-pm-appversion.

      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      Revision:
                        type: object
                      Code:
                        type: integer
                        description: ProtonResponseCode
    put:
      tags: [Drive]
      summary: Commit a revision
      operationId: putDriveV2VolumesByVolumeIDFilesByLinkIDRevisionsByRevisionID
      description: The revision becomes the current active one and the updated file content become available for reading.
      parameters:
        - name: volumeID
          in: path

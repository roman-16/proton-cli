openapi: 3.1.0
info:
  title: Proton API
  version: "1.0"
  description: |
    Auto-generated from Proton's own TypeScript source files.
    Sources: https://github.com/ProtonMail/WebClients/tree/main/packages/shared/lib/api
             https://github.com/ProtonMail/WebClients/blob/main/packages/pass/types/api/pass.ts
             https://github.com/ProtonDriveApps/sdk/blob/main/client/js/src/internal/apiService/driveTypes.ts

servers:
  - url: https://mail.proton.me/api
    description: Proton production API

security:
  - protonAuth: []

components:
  securitySchemes:
    protonAuth:
      type: http
      scheme: bearer
      description: |
        Requires headers: Authorization (Bearer token), x-pm-uid (session UID), x-pm-appversion.
  schemas:
    ApiResponse:
      type: object
      description: Standard Proton API JSON response envelope.
      properties:
        Code:
          type: integer
          description: Proton response code (1000/1001 indicate success).


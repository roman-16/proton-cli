            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - ManifestSignature
                - SignatureAddress
                - BlockNumber
                - XAttr
                - Photo
                - BlockList
                - ThumbnailToken
                - State
                - ChecksumVerified
              properties:
                ManifestSignature:
                  type: string
                SignatureAddress:
                  type: string
                  description: "Format: email"
                BlockNumber:
                  type: string
                  description: Unused. Was meant for shorter partial revisions.
                XAttr:
                  type: string
                  description: Extended attributes encrypted with link key
                Photo:
                  type: string
                BlockList:
                  type: string
                  description: Ignored entirely by API. Field can be removed from request by client.
                ThumbnailToken:
                  type: string
                State:
                  type: string
                  description: Ignored entirely by API, revision will always be committed (made active)

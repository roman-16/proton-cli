  /drive/report/share:
    post:
      tags: [Drive]
      summary: Report Share for abuse
      operationId: postDriveReportShare
      description: "Potential codes and their meaning: - 9001: User is required to complete HV; always in anonymous context or in authenticated context when 'ReporterEmail' is passed and does not belong to user . - 12087: Human verification address mismatch"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - SharePassphrase
                - AbuseCategory
                - ReporterMessage
                - ReporterEmail
                - ShareURL
                - ShareURLPassword
                - ShareID
                - LinkID
                - RevisionID
                - BonaFide
              properties:
                SharePassphrase:
                  type: string
                  description: "Passphrase for reported Share's Share key, unencrypted, as a base64 encoded string"
                MemberSessionKey:
                  type: string
                  description: Session-key of the membership, or invitation. Required for reporting direct Shares
                AbuseCategory:
                  type: string
                ReporterMessage:
                  type: string
                  description: User message about the report. Required for copyright or leak reports.
                ReporterEmail:
                  type: string
                  description: "Format: email"
                ShareURL:
                  type: string
                  description: For reporting ShareURLs, complete including fragment
                ShareURLPassword:
                  type: string
                  description: Full ShareURL password, including custom part, as string, escaped for JSON; Required when reporting ShareURLs
                ShareID:
                  type: string
                LinkID:
                  type: string
                  description: Nullable; A Link in the reported Share, can be used to report only a single Link in the Share
                RevisionID:
                  type: string
                  description: Nullable; To report only a particular Revision of a Link in the reported Share
                BonaFide:
                  type: boolean
                  description: The user declares the report is submitted in good-faith (bona fide); Must always be true, but requires specific user-action (opt-in)
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      Code:
                        type: integer
                        description: ProtonResponseCode

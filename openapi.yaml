      description: Create a new revision on an existing link. Only one draft can be created at a time. A draft can be deleted using the DELETE revision endpoint if the new draft should be created regardless. The error code indicates the reason for failure. Client unique ID can be used to track revision ownership to improve concurrency control. It can be a single persistent client ID generated by the client and stored locally, or it can be specific to the revision. The client can use it to identify revisions in case it failed to receive the confirmation of the revision creation.
      parameters:
        - name: volumeID
          in: path

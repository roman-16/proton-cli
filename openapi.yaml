      operationId: getDriveHealthHashCheck
      description: Tells the client if the user is potentially impacted by Windows-Drive January 2026 incident and client should check hashes
      parameters:
        - name: ClientUID
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      Code:
                        type: integer
                      Check:
                        type: boolean
    post:
      tags: [Drive]
      summary: Report hash check progress
      operationId: postDriveHealthHashCheck
      description: Inform the backend of the hash-check progress for a given client. Only report twice, once when starting with 0-counts and once when finished (be it successfully or with failures)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - ClientUID
                - RefreshedItemCount
                - InspectedItemCount
                - FailedItemCount
                - State
              properties:
                ClientUID:
                  type: string
                RefreshedItemCount:
                  type: integer
                  description: Number of files that had to be redownloaded due to an issue
                InspectedItemCount:
                  type: integer
                  description: Number of files that were suspicious and had to be inspected for issues
                FailedItemCount:
                  type: integer
                  description: Number of files that could not be analysed or repaired
                State:
                  type: integer
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'

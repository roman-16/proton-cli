    put:
      tags: [Drive]
      summary: Move link (v2)
      operationId: putDriveV2VolumesByVolumeIDLinksByLinkIDMove
      description: Move a file or folder. Client must provide new values for fields encrypted with parent NodeKey. Clients moving a file or folder MUST reuse the existing session keys for the name and passphrase as these are also used by shares pointing to the link. The passphrase should NOT be changed,reusing same session key as previously
      parameters:
        - name: volumeID
          in: path
          required: true
          schema:
            type: string
        - name: linkID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - Name
                - NodePassphrase
                - Hash
                - ParentLinkID
                - OriginalHash
                - NameSignatureEmail
                - ContentHash
                - NodePassphraseSignature
                - SignatureEmail
              properties:
                Name:
                  type: string
                  description: Name, reusing same session key as previously.
                NodePassphrase:
                  type: string
                  description: Node passphrase, reusing same session key as previously.
                Hash:
                  type: string
                  description: Name hash
                ParentLinkID:
                  type: string
                OriginalHash:
                  type: string
                  description: Current name hash before move operation. Used to prevent race conditions.
                NameSignatureEmail:
                  type: string
                  description: Signature email address used for signing name
                ContentHash:
                  type: string
                  description: "Optional, except when moving a Photo-Link. Photo content hash, hmacsha256 of sha1 content using parent folder's hash key [ lower_hex(hmacSha256(folder hash key, lower_hex(sha1(plain content)))) ]"
                NodePassphraseSignature:
                  type: string
                  description: Node Passphrase Signature. Required when moving an anonymous Link. It must be signed by the SignatureEmail address.
                SignatureEmail:
                  type: string
                  description: "Format: email"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      Code:
                        type: integer

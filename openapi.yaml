      operationId: putDriveV2VolumesByVolumeIDLinksByLinkIDRename
      description: "Rename a file or folder. Client must provide new values for fields linked to name. Clients renaming a file or folder MUST reuse the existing session key for the name as it is also used by shares pointing to the link. Users with access only through a public sharing URL (no editor membership) are limited to renaming their own files and folders: - Unauthenticated users must have created them in their session - Authenticated users' email must match the signature email on the node for folders or active revision for files"

name: Sync OpenAPI

on:
  schedule:
    # Mondays at 01:00 UTC: 03:00 CEST in summer, 02:00 CET in winter. Cron is
    # UTC-only and cannot follow DST, so this is the slot that never lands after
    # 03:00 local time.
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: openapi-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0

      - name: Regenerate openapi.yaml
        run: |
          cp openapi.yaml /tmp/openapi-previous.yaml
          devbox run just openapi

      - name: Verify the regenerated spec
        run: |
          devbox run go run ./scripts/openapi-guard \
            --previous /tmp/openapi-previous.yaml \
            --current openapi.yaml \
            --sent tests/api-coverage.golden

      - name: Commit and push
        run: |
          if git diff --quiet -- openapi.yaml; then
            echo "openapi.yaml is already in sync with WebClients."
            exit 0
          fi

          # Checkout paths are `webClients` and `driveSdk` in the justfile.
          webclients=$(git -C /tmp/proton-cli-WebClients rev-parse --short HEAD)
          drivesdk=$(git -C /tmp/proton-cli-DriveSDK rev-parse --short HEAD)

          git config user.name "Roman"
          git config user.email "roman@lerchster.dev"
          git add openapi.yaml
          git commit -F - <<EOF
          chore(openapi): sync generated spec

          Regenerated from ProtonMail/WebClients at ${webclients} and
          ProtonDriveApps/sdk at ${drivesdk}.
          EOF
          git push

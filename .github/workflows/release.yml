name: Release

# CHANGELOG.md is the release button. A version heading in it that has no
# published release is a release request, and this workflow's only job is to make
# that true. So every run is a function of the tree rather than of the event that
# started it: a release that died halfway through finishes by being re-run, and a
# merge that adds no version is a no-op costing seconds.
#
# It follows CI rather than repeating it. The release is the continuation of the
# checks that just passed on that commit, which is what makes "nothing is
# published from a commit that failed the checks" structural instead of a job
# somebody has to remember to keep in front of the build.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

# A release is queued rather than cancelled: two runs publishing the same tag
# would race each other through goreleaser and every channel behind it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  resolve:
    # workflow_run is a privileged trigger: it carries this repository's write
    # token whatever the run that finished. A fork's pull request can come from a
    # branch named `main` and would pass the branch filter on its own, so the
    # release only ever follows a push to this repository's own main.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release: ${{ steps.decide.outputs.release }}
      sha: ${{ steps.decide.outputs.sha }}
      tag: ${{ steps.decide.outputs.tag }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Decide what to release
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          nothing() {
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "$1" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          }

          version=$(go run ./scripts/changelog)
          if [ -z "$version" ]; then
            nothing "CHANGELOG.md names no version to release."
          fi
          tag="v$version"

          # A published release is the record of a version having shipped; a draft
          # or a missing one is a release that still has to happen. Asking GitHub
          # rather than remembering is what makes a re-run finish the job.
          state=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null || echo missing)
          if [ "$state" = "false" ]; then
            nothing "$tag is already published; CHANGELOG.md asks for nothing new."
          fi

          # A tag outlives the run that pushed it, so a resumed release is the
          # tag's own commit - the one the checks ran against - and not whatever
          # main has become since.
          #
          # Which is only true of a commit the checks actually reached, and
          # ancestry is how that is asked: the commit an interrupted release
          # tagged is behind the one CI has just finished on, while a commit that
          # entered the repository as a tag rather than through main is nowhere in
          # that history. Publishing the second would build and sign whatever it
          # contained, so the release stops rather than resolving it.
          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            sha=$(git rev-parse "$tag^{commit}")
            if ! git merge-base --is-ancestor "$sha" "$HEAD_SHA"; then
              echo "::error::$tag names $sha, which is not in the history that passed CI at $HEAD_SHA."
              exit 1
            fi
            echo "Tag $tag exists; resuming the release from $sha."
          else
            sha="$HEAD_SHA"
          fi

          {
            echo "release=true"
            echo "sha=$sha"
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Releasing $tag"
            echo
            go run ./scripts/changelog --notes
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: resolve
    if: needs.resolve.outputs.release == 'true'
    runs-on: ubuntu-latest
    outputs:
      goreleaser: ${{ steps.goreleaser.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Tag the release
        # The tag is the one thing here that outlives a failed run: it is fetched
        # by users, resolved by `go install`, and the version goreleaser derives.
        # So it is pushed only once everything that can fail has passed, and it
        # names the exact commit those checks and builds ran against.
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            echo "Reusing existing tag $TAG."
            exit 0
          fi
          git config user.name "Roman"
          git config user.email "roman@lerchster.dev"
          git tag --annotate "$TAG" "$SHA" --message "Release $TAG"
          git push origin "$TAG"

      - name: Write the release notes
        # Into the runner's temporary directory, never the checkout: `goreleaser
        # release` refuses to run against a dirty working tree.
        #
        # Which release came before this one is a fact about the repository's
        # tags, so the compare link is read from git rather than written by hand
        # into a file that would then have to be kept true.
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          go run ./scripts/changelog --notes > "$notes"
          previous=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          if [ -n "$previous" ]; then
            printf '\n**Full Changelog**: %s/%s/compare/%s...%s\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$previous" "$TAG" >> "$notes"
          fi
          cat "$notes"

      # GoReleaser builds the binaries and publishes to third-party package
      # repositories in one step, and AUR being unreachable must not stop a release
      # that built correctly. So this step is allowed to fail and the verification
      # below is what actually gates the release: it fails the job when an asset a
      # user installs from is missing. Splitting the third-party publishing into
      # jobs of its own needs `goreleaser publish`, which is Pro-only, so the
      # step's outcome is exported instead: it is how the report tells AUR,
      # Homebrew and winget refusing a release from lagging behind one.
      - name: Run GoReleaser
        id: goreleaser
        continue-on-error: true
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          AUR_KEY: ${{ secrets.AUR_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_WINGET_TOKEN: ${{ secrets.TAP_WINGET_TOKEN }}

      - name: Verify GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          assets=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          echo "Assets on $TAG:"; echo "$assets"
          missing=()
          for a in checksums.txt \
                   proton-cli_linux_amd64 proton-cli_linux_arm64 \
                   proton-cli_darwin_amd64 proton-cli_darwin_arm64 \
                   proton-cli_windows_amd64.exe proton-cli_windows_arm64.exe; do
            grep -qxF "$a" <<<"$assets" || missing+=("$a")
          done
          grep -q '_linux_amd64\.deb$' <<<"$assets" || missing+=("*_linux_amd64.deb")
          grep -q '_linux_arm64\.deb$' <<<"$assets" || missing+=("*_linux_arm64.deb")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::GitHub release $TAG is missing required assets: ${missing[*]}"
            exit 1
          fi
          echo "GitHub release $TAG has all required assets."

      - name: Verify the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          # GitHub stores a release body with CRLF line endings; the notes were
          # written with LF. Nothing else about them may differ.
          published=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq '.body' | tr -d '\r')
          if [ "$published" != "$(cat "$RUNNER_TEMP/release-notes.md")" ]; then
            echo "::error::the release page for $TAG does not carry the CHANGELOG.md section it was built from"
            exit 1
          fi
          echo "Release $TAG carries its changelog section."

  apt-repo:
    needs: [resolve, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # reprepro keeps no database between runs, so the pool is rebuilt from
      # scratch every release and whatever is not handed to it is dropped. The
      # releases are where every .deb this project ever published already lives,
      # immutably, which makes them the thing to rebuild from: the repository
      # then holds a run of versions rather than only the newest, and `apt
      # install proton-cli=X.Y.Z` can undo a bad release.
      #
      # The tag being released must arrive; the ones behind it are best-effort,
      # since a tag old enough to predate the .deb packages has none to give.
      - name: Collect the .deb assets to publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          mkdir -p debs
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*.deb' \
            --dir debs

          # Ten is a deep enough run to roll back through and shallow enough
          # that the download stays a few seconds rather than growing without
          # bound as the project ages.
          gh release list --repo "$GITHUB_REPOSITORY" --limit 10 --json tagName \
            | jq --raw-output --arg tag "$TAG" '.[] | select(.tagName != $tag) | .tagName' \
            | while read -r previous; do
                gh release download "$previous" \
                  --repo "$GITHUB_REPOSITORY" \
                  --pattern '*.deb' \
                  --dir debs \
                  --clobber \
                  || echo "::notice title=No packages::$previous ships no .deb"
              done

          ls -la debs/

      - name: Build signed APT repository
        id: apt
        uses: morph027/apt-repo-action@2acc5b2a47fc257aa6503ef77ca64ff6b0e31298 # v3
        with:
          repo-name: proton-cli
          scan-dir: debs
          codename: stable
          components: main
          architectures: amd64 arm64
          signing-key: ${{ secrets.GPG_PRIVATE_KEY }}
          signing-key-passphrase: ${{ secrets.GPG_PRIVATE_KEY_PASSPHRASE }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ steps.apt.outputs.dir }}

  apt-deploy:
    needs: apt-repo
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  npm-publish:
    needs: [resolve, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          registry-url: "https://registry.npmjs.org"

      - name: Download release binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p npm-bin
          gh release download "${{ needs.resolve.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --pattern 'proton-cli_linux_amd64' \
            --pattern 'proton-cli_linux_arm64' \
            --pattern 'proton-cli_darwin_amd64' \
            --pattern 'proton-cli_darwin_arm64' \
            --pattern 'proton-cli_windows_amd64.exe' \
            --pattern 'proton-cli_windows_arm64.exe' \
            --dir npm-bin
          ls -la npm-bin/

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.resolve.outputs.tag }}
        run: node scripts/publish-npm.mjs

  report:
    needs: [resolve, release, apt-repo, apt-deploy, npm-publish]
    if: always() && needs.resolve.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Channel status report
        env:
          APT_DEPLOY_RESULT: ${{ needs.apt-deploy.result }}
          APT_REPO_RESULT: ${{ needs.apt-repo.result }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_RESULT: ${{ needs.release.outputs.goreleaser }}
          NPM_RESULT: ${{ needs.npm-publish.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          v="${TAG#v}"
          assets=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length' 2>/dev/null || true)
          probe_apt() { curl -fsS https://roman-16.github.io/proton-cli/dists/stable/main/binary-amd64/Packages 2>/dev/null | awk '$1=="Version:"{print $2}' | sort -V | tail -1; }
          probe_aur() { curl -fsS 'https://aur.archlinux.org/rpc/v5/info?arg[]=proton-cli-bin' 2>/dev/null | jq -r '.results[0].Version // ""' | sed 's/-[0-9]*$//'; }
          probe_npm() { curl -fsS https://registry.npmjs.org/@roman-16%2Fproton-cli 2>/dev/null | jq -r '."dist-tags".latest // ""'; }

          # Poll a probe until it reports the target version or the deadline
          # passes: every one of these is read through a cache, and a read that
          # lags a just-succeeded publish must not be reported as a failed one.
          # A report that cries wolf is a report nobody reads.
          #
          # AUR gets longer because it lags the most: its database records a
          # push about a minute later, and the RPC answers from a cache for
          # minutes after that. Its package page is cached longer still, so a
          # version missing from the page is not a version missing from AUR.
          poll() {
            local fn="$1" want="$2" got deadline=$(( SECONDS + ${3:-60} ))
            while :; do
              got="$($fn)"
              if [ "$got" = "$want" ] || [ "$SECONDS" -ge "$deadline" ]; then
                printf '%s' "$got"; return
              fi
              sleep 6
            done
          }

          apt="$(poll probe_apt "$v")"
          aur="$(poll probe_aur "$v" 300)"
          npm="$(poll probe_npm "$v")"
          brew=$(gh api repos/roman-16/homebrew-tap/contents/Casks/proton-cli.rb --jq '.content' 2>/dev/null | base64 -d 2>/dev/null | sed -n 's/.*version "\([^"]*\)".*/\1/p' | head -1)

          row() { printf '| %s | %s | %s |\n' "$1" "$2" "$3" >> "$GITHUB_STEP_SUMMARY"; }
          {
            echo "## Release $TAG - channel status"
            echo
            echo "| Channel | Status | Detail |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$RELEASE_RESULT" = success ] && [ "${assets:-0}" -gt 0 ]; then
            row "GitHub release" "✅" "$TAG ($assets assets)"
          elif [ "$RELEASE_RESULT" != success ]; then
            row "GitHub release" "❌" "release job: $RELEASE_RESULT"
            echo "::error::GitHub release did not complete ($RELEASE_RESULT)"
          elif [ -z "$assets" ]; then
            row "GitHub release" "⚠️" "unreachable"; echo "::warning::GitHub release could not be checked"
          else
            row "GitHub release" "❌" "no assets on $TAG"
            echo "::error::GitHub release $TAG carries no assets"
          fi

          # A version that is live is live, whatever the job that published it
          # went on to report: a re-release fails `npm publish` on a version it
          # already has, and that is a channel carrying the version, not a
          # failure. So the probe is read first, and the job result is what
          # separates a channel that refused the release from one behind it.
          check() {
            local name="$1" want="$2" got="$3" job="${4:-success}"
            if [ "$got" = "$want" ]; then row "$name" "✅" "$got"
            elif [ "$job" != success ]; then row "$name" "❌" "job: $job"; echo "::error::$name did not publish ($job)"
            elif [ -z "$got" ]; then row "$name" "⚠️" "unreachable"; echo "::warning::$name could not be checked"
            else row "$name" "⚠️" "still $got (expected $want)"; echo "::warning::$name is still $got, expected $want - re-run to backfill"
            fi
          }

          if [ "$APT_REPO_RESULT" != success ]; then apt_job="$APT_REPO_RESULT"; else apt_job="$APT_DEPLOY_RESULT"; fi

          check "apt" "$v" "${apt:-}" "$apt_job"
          check "AUR" "$v" "$aur" "$GORELEASER_RESULT"
          check "Homebrew" "$v" "$brew" "$GORELEASER_RESULT"
          check "npm" "$v" "$npm" "$NPM_RESULT"

          # The manifest is what makes a version installable; the branch in the
          # fork only proves the pull request was pushed, and it is all there is
          # to see until Microsoft merges it hours later.
          if gh api "repos/microsoft/winget-pkgs/contents/manifests/r/Roman-16/ProtonCLI/$v" >/dev/null 2>&1; then
            row "winget" "✅" "merged into microsoft/winget-pkgs"
          elif gh api "repos/roman-16/winget-pkgs/branches/proton-cli-$v" >/dev/null 2>&1; then
            row "winget" "✅" "PR open from proton-cli-$v"
          elif [ "$GORELEASER_RESULT" != success ]; then
            row "winget" "❌" "job: $GORELEASER_RESULT"; echo "::error::winget did not publish ($GORELEASER_RESULT)"
          else
            row "winget" "⚠️" "nothing found for $v"; echo "::warning::winget: no manifest and no branch for $v"
          fi

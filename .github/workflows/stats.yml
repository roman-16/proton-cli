name: Stats

# Records the public counters that describe how proton-cli is obtained, onto the
# data branch the documentation site reads.
#
# This runs on a schedule because two of its sources cannot be read late. A
# release asset's downloads are a lifetime total, so a rate exists only where
# something subtracts one day's reading from the next; and GitHub's traffic
# endpoints answer with the last fourteen days and delete the rest, so a run
# that does not happen inside that window loses those days permanently.
#
# The collector needs STATS_TOKEN: a personal access token with classic `repo`
# scope, or a fine-grained one with `Administration: read`. GitHub refuses the
# traffic endpoints to the token a workflow is given by default, whatever the
# permissions block below says, and the run fails loudly rather than quietly
# recording everything except the part that expires.
on:
  schedule:
    # Midnight UTC, so a run covers a calendar day. GitHub starts a scheduled
    # job whenever it has room, which at this hour is often hours late; a
    # download row is named for the day its interval began, so the delay moves
    # nothing out of the day it belongs to.
    - cron: "0 0 * * *"
  workflow_dispatch:

# One writer to the data branch. A queued run has nothing new to say that a
# fresher one will not say better, and two pushing at once would conflict.
concurrency:
  group: stats
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Built before the branch is switched, because the data branch holds no
      # source to build from.
      - name: Build the collector
        run: go build -o "$RUNNER_TEMP/stats" ./scripts/stats

      - name: Record today's reading
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name "Roman"
          git config user.email "roman@lerchster.dev"

          # The branch carries no history in common with main, so the first run
          # starts it empty rather than from a tree of source it has no use for.
          if git fetch --depth 1 origin data; then
            git switch --force-create data --track origin/data
          else
            git switch --orphan data
          fi

          "$RUNNER_TEMP/stats"

          git add --all
          if git diff --cached --quiet; then
            echo "::notice title=No change::Every counter reads the same as the last run."
            exit 0
          fi
          git commit --message "stats: $(date --utc +%Y-%m-%d)"
          git push origin data
